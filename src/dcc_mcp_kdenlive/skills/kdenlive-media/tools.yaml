{
  "tools": [
    {
      "name": "add_media",
      "description": "Add file media, a bounded local PNG still using native qimage, a color producer, or a Kdenlive title template to the project bin.",
      "input_schema": {
        "type": "object",
        "properties": {
          "path": {
            "type": "string"
          },
          "output_path": {
            "type": "string",
            "description": "New file path in an existing directory; existing destinations are never replaced."
          },
          "resource": {
            "type": "string"
          },
          "duration": {
            "type": "integer",
            "minimum": 0
          },
          "kind": {
            "type": "string",
            "default": "file",
            "enum": [
              "file",
              "image",
              "color",
              "title"
            ],
            "description": "image selects native qimage for one local PNG still (64 MiB,8192 pixels per edge,16 megapixels max); file retains avformat behavior. Native decoding and editor preview are separate validation. Sequence/directory/query/inline-XML resource syntax is refused."
          },
          "name": {
            "type": "string",
            "default": ""
          },
          "expected_sha256": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$",
            "description": "Source revision returned by inspect_project. A mismatch rejects the edit."
          }
        },
        "required": [
          "path",
          "output_path",
          "resource",
          "duration"
        ],
        "additionalProperties": false
      },
      "output_schema": {
        "type": "object"
      },
      "source_file": "scripts/add_media.py",
      "execution": "sync",
      "job_strategy": "monolithic",
      "affinity": "any",
      "enforce_thread_affinity": true,
      "requires_in_process": true,
      "timeout_hint_secs": 60,
      "annotations": {
        "read_only_hint": false,
        "destructive_hint": true,
        "idempotent_hint": false,
        "open_world_hint": true,
        "deferred_hint": false
      }
    },
    {
      "name": "relink_media",
      "description": "Relink bin media and timeline instances to an existing local media file.",
      "input_schema": {
        "type": "object",
        "properties": {
          "path": {
            "type": "string"
          },
          "output_path": {
            "type": "string",
            "description": "New file path in an existing directory; existing destinations are never replaced."
          },
          "producer_id": {
            "type": "string"
          },
          "resource": {
            "type": "string"
          },
          "expected_sha256": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$",
            "description": "Source revision returned by inspect_project. A mismatch rejects the edit."
          }
        },
        "required": [
          "path",
          "output_path",
          "producer_id",
          "resource"
        ],
        "additionalProperties": false
      },
      "output_schema": {
        "type": "object"
      },
      "source_file": "scripts/relink_media.py",
      "execution": "sync",
      "job_strategy": "monolithic",
      "affinity": "any",
      "enforce_thread_affinity": true,
      "requires_in_process": true,
      "timeout_hint_secs": 60,
      "annotations": {
        "read_only_hint": false,
        "destructive_hint": true,
        "idempotent_hint": false,
        "open_world_hint": true,
        "deferred_hint": false
      }
    }
  ]
}
