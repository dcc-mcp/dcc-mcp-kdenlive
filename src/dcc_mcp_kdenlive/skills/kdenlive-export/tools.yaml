{
  "tools": [
    {
      "name": "render_project",
      "description": "Render an explicit frame range through MLT to MP4, WebM, ProRes MOV or WAV. Poll core jobs_get_status; use jobs_cancel to cancel.",
      "input_schema": {
        "type": "object",
        "properties": {
          "path": {
            "type": "string"
          },
          "output_path": {
            "type": "string",
            "description": "New file path in an existing directory; existing destinations are never replaced."
          },
          "preset": {
            "type": "string",
            "default": "mp4"
          },
          "start": {
            "type": "integer",
            "minimum": 0,
            "default": 0
          },
          "end": {
            "type": "integer",
            "minimum": 0,
            "default": 0
          },
          "timeout": {
            "type": "integer",
            "minimum": 0,
            "default": 3600
          }
        },
        "required": [
          "path",
          "output_path",
          "start",
          "end"
        ],
        "additionalProperties": false
      },
      "output_schema": {
        "type": "object"
      },
      "source_file": "scripts/render_project.py",
      "execution": "async",
      "job_strategy": "monolithic",
      "affinity": "any",
      "enforce_thread_affinity": true,
      "requires_in_process": true,
      "timeout_hint_secs": 86400,
      "annotations": {
        "read_only_hint": false,
        "destructive_hint": true,
        "idempotent_hint": false,
        "open_world_hint": true,
        "deferred_hint": true
      }
    }
  ]
}
