{
  "tools": [
    {
      "name": "add_effect",
      "description": "Attach an installed MLT audio/video effect to a producer or track. Producer effects affect all its uses.",
      "input_schema": {
        "type": "object",
        "properties": {
          "path": {
            "type": "string"
          },
          "output_path": {
            "type": "string",
            "description": "New file path in an existing directory; existing destinations are never replaced."
          },
          "element_id": {
            "type": "string"
          },
          "service": {
            "type": "string"
          },
          "parameters": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          },
          "effect_id": {
            "type": "string",
            "default": ""
          },
          "expected_sha256": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$",
            "description": "Source revision returned by inspect_project. A mismatch rejects the edit."
          }
        },
        "required": [
          "path",
          "output_path",
          "element_id",
          "service",
          "parameters"
        ],
        "additionalProperties": false
      },
      "output_schema": {
        "type": "object"
      },
      "source_file": "scripts/add_effect.py",
      "execution": "sync",
      "job_strategy": "monolithic",
      "affinity": "any",
      "enforce_thread_affinity": true,
      "requires_in_process": true,
      "timeout_hint_secs": 60,
      "annotations": {
        "read_only_hint": false,
        "destructive_hint": true,
        "idempotent_hint": false,
        "open_world_hint": true,
        "deferred_hint": false
      }
    },
