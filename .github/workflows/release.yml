name: Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  version:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        id: release
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
  artifacts:
    needs: version
    if: needs.version.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - name: Verify exact release identity
        run: |
          set -euo pipefail
          # Anchor every check on the commit the release TAG resolves to, never on
          # github.sha. The release PR can be merged while this run's `checks` job is
          # still in flight; release-please then tags that later merge commit, so
          # release-please's `sha` output legitimately differs from the commit that
          # started this run. Asserting RELEASE_SHA == GITHUB_SHA made the publish job
          # fail in exactly that case, and the next push skipped it (created != true),
          # so the release shipped with no artifacts and could never self-heal.
          tag_commit=""
          for _ in $(seq 1 12); do
            if git fetch --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" 2>/dev/null; then
              tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
              [ -n "$tag_commit" ] && break
            fi
            echo "waiting for $RELEASE_TAG to become visible on origin"
            sleep 5
          done
          if [ -z "$tag_commit" ]; then
            echo "::error::release tag $RELEASE_TAG is not resolvable on origin"
            exit 1
          fi
          echo "tag $RELEASE_TAG -> $tag_commit"
          test "$tag_commit" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python -c 'import os,tomllib; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v"+v'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/build_artifacts.py
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/*
      - run: gh release upload "$RELEASE_TAG" dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pypi-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
  pypi:
    needs: artifacts
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-packages
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
