name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-protocol:
    name: Native protocol / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - name: Linux Qt SDK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev ninja-build
      - name: Windows Qt SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.10.0 win64_msvc2022_64 --archives qtbase --outputdir "$env:RUNNER_TEMP/qt"
          "CMAKE_PREFIX_PATH=$env:RUNNER_TEMP/qt/6.10.0/msvc2022_64" >> $env:GITHUB_ENV
          "$env:RUNNER_TEMP/qt/6.10.0/msvc2022_64/bin" >> $env:GITHUB_PATH
      - run: cmake -S native -B build/native
      - run: cmake --build build/native --config Release --parallel 2
      - run: ctest --test-dir build/native -C Release --output-on-failure
      - name: Verify overlay against exact upstream source
        shell: bash
        run: |
          git clone --depth 1 --branch v26.08.1 https://github.com/KDE/kdenlive.git build/upstream
          python tools/prepare_native_host.py build/upstream
          git -C build/upstream diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-protocol-${{ matrix.os }}
          path: |
            build/native/Testing/Temporary/LastTest.log
            build/native/bridge-results.xml
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.7', '3.12']
    env:
      DCC_MCP_DISABLE_DEFAULT_SKILL_PATHS: '1'
      DCC_MCP_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - name: Require native core (py37-lite is insufficient)
        run: python -c "from dcc_mcp_core import DccServerBase; from dcc_mcp_core import _core; print(_core.__file__)"
      - run: python -m pytest -q
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - run: python -m pip install ruff build twine
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/build_artifacts.py
      - name: Install wheel outside source tree
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-smoke/bin/dcc-mcp-kdenlive --version
          /tmp/wheel-smoke/bin/dcc-mcp-kdenlive doctor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution
          path: dist/
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KDENLIVE_LIVE_TEST: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y melt ffmpeg libmlt-data
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests/test_live.py -q
